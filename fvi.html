<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FP Value Index (FVI) 계산기</title>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <script>
    const KAKAO_JAVASCRIPT_KEY = "2a2e79669ea6bbbf07f5d68ffa1cc67b";
    Kakao.init(KAKAO_JAVASCRIPT_KEY);
  </script>

  <style>
    /* --- 기존 스타일 + 수정/추가된 스타일 --- */
    html, body { width:100%; height:100%; margin:0; padding:0; }
    :root{ --primary-color:#0a7aff; --accent-warm:#c4552e; --background-color:#f2f2f7; --card:#ffffff; --text:#111; --muted:#4b5563; --border:#e5e7eb; --input:#f3f4f6; --shadow:0 22px 42px rgba(0,0,0,.12); }
    [data-theme="dark"]{ --background-color:#0b0d0f; --card:#15181b; --text:#f5f7fa; --muted:#d1d5db; --border:#2c3136; --input:#1c2024; --shadow:0 22px 42px rgba(0,0,0,.38); }
    #gaw-calc-root #gstep-6 .input-group{ display:block!important; width:100%!important; max-width:none!important; flex:1 1 100%!important; margin:0!important; padding:0!important; }
    #gaw-calc-root #gstep-6 #cert-list{ display:flex!important; flex-direction:column!important; gap:12px!important; align-items:stretch!important; width:100%!important; }
    #gaw-calc-root #gstep-6 #cert-list > label.card-check > span{ width:100%!important; max-width:none!important; }
    #bg-fill{position:fixed; inset:0; z-index:-1;}
    .bg-gradient{background-size:400% 400%; animation:gradientBG 22s ease infinite;}
    .bg-gradient--light{background:linear-gradient(135deg,#ffe6e6,#fde2f3,#e5e9ff,#dff6ff,#e6ffe6,#fff6e0,#ffe6cc,#ffd9e6);}
    .bg-gradient--dark{background:linear-gradient(135deg,#2b3133,#272a35,#222a36,#1d2a31,#202f26,#2a2922,#2e2623,#2c252c);}
    @keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    #gaw-calc-root{display:flex; justify-content:center; align-items:center; min-height:100svh; width:100%; padding:28px 12px; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,Helvetica,Arial,sans-serif; letter-spacing:-.01em;}
    #gaw-calc-root *, #gaw-calc-root *::before, #gaw-calc-root *::after{ box-sizing:border-box; }
    #calculator-container{width:100%; max-width:760px; background:var(--card); color:var(--text); border-radius:24px; border:1px solid var(--border); box-shadow:var(--shadow); padding:46px 48px; position:relative;}
    .theme-switch{position:absolute; top:16px; right:16px; z-index:10; display:inline-flex; flex-direction:column; align-items:flex-end; gap:6px;}
    .theme-switch input{display:none;}
    .theme-switch .track{width:96px; height:36px; border-radius:999px; background:var(--input); border:1px solid var(--border); position:relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(0,0,0,.06);}
    .theme-switch .thumb{position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25); transition:left .25s ease, background .25s ease;}
    [data-theme="dark"] .theme-switch .thumb{background:#2b2f33;}
    .theme-switch input:checked + .track .thumb{left:64px}
    .theme-switch .switch-caption{font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:10px; margin-right:4px; align-items:center;}
    .switch-caption .separator{opacity:.35;} .switch-caption .light,.switch-caption .dark{opacity:.45;}
    .theme-switch input:not(:checked) ~ .switch-caption .light{opacity:1; color:var(--text);}
    .theme-switch input:checked ~ .switch-caption .dark{opacity:1; color:var(--text);}
    #calculator-container h1{text-align:center; font-size:32px; line-height:1.2; font-weight:800; margin:0 0 8px; letter-spacing:-.02em;}
    #subtitle{text-align:center; color:var(--muted); margin-bottom:18px;}
    #progress-bar-container{ height:12px; border-radius:999px; overflow:hidden; background:#2f343a; margin:8px 0 28px; }
    #progress-bar{ height:100%; width:0%; background:var(--primary-color); transition:width .35s ease; }
    .gstep{ display:none; animation:fade .22s; } .gstep.active{ display:block; }
    .gstep h2{ font-size:22px; line-height:1.35; font-weight:800; margin:6px 0 18px; }
    .input-group{ margin-bottom:16px; }
    .input-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:680px){ .input-row{ grid-template-columns:1fr; } }
    label{ display:block; color:var(--muted); font-weight:800; margin-bottom:8px; }
    input[type="number"], input[type="text"]{ width:100%; height:56px; border-radius:14px; border:1px solid var(--border); background:var(--input); color:var(--text); -webkit-text-fill-color:var(--text); font-size:18px; font-weight:800; padding:0 16px; outline:none; }
    input::placeholder{ color:#9aa3ad; } [data-theme="dark"] input::placeholder{ color:#e5e7eb; }
    .gaw-select{ width:100%; height:56px; border-radius:14px; border:1px solid var(--border); background:var(--input); color:var(--text); font-size:16px; font-weight:800; padding:0 16px; outline:none; appearance:none; -webkit-appearance:none; background-image:url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22292.4%22 height=%22292.4%22%3E%3Cpath fill=%22%234b5563%22 d=%22M287 69.4a17.6 17.6 0 0 0-13-5.4H18.4c-5 0-9.3 1.8-12.9 5.4A17.6 17.6 0 0 0 0 82.2c0 5 1.8 9.3 5.4 12.9l128 127.9c3.6 3.6 7.8 5.4 12.8 5.4s9.2-1.8 12.8-5.4L287 95c3.5-3.5 5.4-7.8 5.4-12.8 0-5-1.9-9.2-5.5-12.8z%22/%3E%3C/svg%3E'); background-repeat:no-repeat; background-position:right 16px top 50%; background-size:12px auto;}
    [data-theme="dark"] .gaw-select{ background-image:url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22292.4%22 height=%22292.4%22%3E%3Cpath fill=%22%23d1d5db%22 d=%22M287 69.4a17.6 17.6 0 0 0-13-5.4H18.4c-5 0-9.3 1.8-12.9 5.4A17.6 17.6 0 0 0 0 82.2c0 5 1.8 9.3 5.4 12.9l128 127.9c3.6 3.6 7.8 5.4 12.8 5.4s9.2-1.8 12.8-5.4L287 95c3.5-3.5 5.4-7.8 5.4-12.8 0-5-1.9-9.2-5.5-12.8z%22/%3E%3C/svg%3E');}
    .slider{ width:100%; } input[type="range"]{ width:100%; height:12px; border-radius:999px; -webkit-appearance:none; appearance:none; outline:none; background:#2f343a; }
    input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--accent-warm); border:3px solid #ffffff22; margin-top:-7px; }
    input[type="range"]::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; background:var(--accent-warm); border:3px solid #ffffff22; }
    .val-pill{ display:inline-block; min-width:56px; padding:4px 10px; border-radius:999px; font-weight:900; background:#e7f0ff; color:#0a58ca; font-size:12px; margin-left:6px; }
    .checks{ display:flex; flex-direction:column; gap:12px; }
    .card-check input{ display:none; }
    .card-check span{ display:flex; align-items:center; gap:12px; min-height:56px; border-radius:12px; background:#eef2f7; border:1px solid var(--border); color:#1f2937; padding:10px 16px; font-size:15px; font-weight:800; }
    [data-theme="dark"] .card-check span{ color:#f2f6fb; background:#21262c; }
    .card-check input:checked + span{ border-color:var(--primary-color); box-shadow:0 0 0 2px rgba(10,122,255,.25); }
    .card-check span i{ width:22px; height:22px; border-radius:6px; border:2px solid #8a9096; background:#15181a; position:relative; }
    .card-check input:checked + span i::after{ content:""; position:absolute; left:6px; top:2px; width:8px; height:14px; border:3px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); }
    .checks.compact .card-check span{ min-height:48px; padding:8px 14px; font-size:14px; }
    #navigation-buttons{ margin-top:24px; display:flex; gap:10px; }
    button{ height:56px; border-radius:12px; border:none; background:var(--primary-color); color:#fff; font-size:18px; font-weight:900; letter-spacing:-.01em; cursor:pointer; transition:transform .08s, filter .2s; flex:1; }
    button:active{ transform:translateY(1px); }
    #prev-btn{ background:transparent; color:var(--primary-color); border:1px solid var(--primary-color); }
    #result-display{ text-align:center; }
    #badge{ display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900; margin-bottom:6px; background:#e5f0ff; color:#0a58ca; }
    #fvi-score{ font-size:40px; font-weight:900; margin:0 0 8px; }
    .final-value{ font-size:28px; font-weight:900; color:var(--text); margin:10px 0 4px; }
    .value-unit{ font-size:16px; color:#7fb1ff; }
    .result-description{ color:var(--muted); margin:6px 0 16px; }
    .insights{ text-align:left; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:14px; color:var(--text); white-space:normal; line-height: 1.7; font-size: 15px; }
    .loader{ width:24px; height:24px; border:3px solid var(--border); border-bottom-color: var(--primary-color); border-radius:50%; animation: rotation 1s linear infinite; }
    @keyframes rotation{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
    #ai-result-container{ margin-top:20px }
    .ai-sections{ display:grid; gap:21px; padding:20px 6px; }
    .ai-card{ padding:6px 16px; text-align:left; }
   .ai-card h4{ margin:0 0 10px; font-size:17px; font-weight:800; color:var(--text); }
    @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

    #grade-text strong { font-size: 1.1em; color: var(--primary-color); }
    #additional-results-container { margin-top: 24px; padding: 20px; border-radius: 16px; background-color: var(--input); border: 1px solid var(--border); text-align: left; }
    #additional-results-container h3 { font-size: 20px; font-weight: 800; margin-top: 0; margin-bottom: 16px; color: var(--text); }
    .result-breakdown p { margin: 8px 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
    .result-breakdown p > span:first-child { font-weight: 700; }
    .result-breakdown p > span:last-child { font-weight: 800; font-size: 16px; color: var(--text); }
    .result-breakdown .total { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .result-breakdown .total > span:last-child { color: var(--primary-color); font-size: 18px; }
    .growth-indicators { margin-top: 16px; }
    .growth-indicators .badge { display: inline-block; padding: 5px 10px; border-radius: 8px; background-color: #e0e7ff; color: #3730a3; font-size: 12px; font-weight: 700; margin-right: 8px; margin-bottom: 8px; }
    [data-theme="dark"] .growth-indicators .badge { background-color: #312e81; color: #e0e7ff; }
    .info-line { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; opacity: 0.8; }
    .disclaimer { font-size: 12px; color: var(--muted); opacity: 0.8; margin-top: 16px; text-align: center; }

    @media (max-width: 680px) {
      .theme-switch { top: 20px; right: 20px; gap: 0; }
      .theme-switch .switch-caption { display: none; }
      .theme-switch .track { width: 52px; height: 30px; }
      .theme-switch .thumb { width: 22px; height: 22px; }
      .theme-switch input:checked + .track .thumb { left: 26px; }
      #calculator-container { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
<div id="bg-fill" class="bg-gradient bg-gradient--light"></div>
<div id="gaw-calc-root" data-theme="light">
  <div id="calculator-container">
    <div class="theme-switch" id="theme-switch">
      <input type="checkbox" id="theme-checkbox" aria-label="Theme switch" />
      <span class="track"><span class="thumb"></span></span>
      <div class="switch-caption" aria-hidden="true">
        <span class="light">Light</span><span class="separator">•</span><span class="dark">Dark</span>
      </div>
    </div>

    <h1>FP Value Index (FVI)</h1>
    <p id="subtitle">현재 가치와 성장 잠재력을 함께 보는 설계사 평가 지수</p>
    <div id="progress-bar-container"><div id="progress-bar"></div></div>

    <form id="calculator-form" onsubmit="return false;">
      
      <div class="gstep active" id="gstep-1">
        
        <h2>기본 정보를 입력해 주세요</h2>
  
  <input type="hidden" id="access-url" />
                <div class="input-row">
          <div class="input-group">
            <label for="user-name">이름 / 별칭</label>
            <input type="text" id="user-name" placeholder="예: 홍길동" />
          </div>
          <div class="input-group">
            <label for="activity-region">주요 활동 지역</label>
            <select id="activity-region" class="gaw-select">
              <option>서울특별시</option> <option>부산광역시</option> <option>대구광역시</option> <option>인천광역시</option> <option>광주광역시</option> <option>대전광역시</option> <option>울산광역시</option> <option>세종특별자치시</option> <option>경기도</option> <option>강원특별자치도</option> <option>충청북도</option> <option>충청남도</option> <option>전북특별자치도</option> <option>전라남도</option> <option>경상북도</option> <option>경상남도</option> <option>제주특별자치도</option> <option>전국</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="birth-year">출생 연도 (YYYY)</label>
            <input type="number" id="birth-year" placeholder="예: 1987" min="1940" max="2015" inputmode="numeric"/>
          </div>
          <div class="input-group">
            <label for="career-length">총 경력 (년)</label>
            <input type="number" id="career-length" placeholder="예: 7" min="0" inputmode="numeric"/>
          </div>
        </div>
      </div>

      <div class="gstep" id="gstep-2">
        <h2>직전년도 소득을 입력해 주세요</h2>
        <div class="input-group">
          <label for="prev-income-krw">연 소득 (원)</label>
          <input type="text" id="prev-income-krw" placeholder="예: 100,000,000" inputmode="numeric" />
          <div class="hint" id="prev-income-hint">예: 100,000,000원 = 1억 0만원</div>
        </div>
      </div>

      <div class="gstep" id="gstep-3">
        <h2>월간 성과를 알려주세요</h2>
        <div class="input-row">
          <div class="input-group">
            <label for="monthly-contracts">월 평균 계약 건수 (건)</label>
            <input type="number" id="monthly-contracts" placeholder="예: 15" min="0" inputmode="numeric" />
          </div>
          <div class="input-group">
            <label for="monthly-premium">월 평균 업적 (만원)</label>
            <input type="number" id="monthly-premium" placeholder="예: 200" min="0" inputmode="numeric" />
          </div>
        </div>
      </div>

      <div class="gstep" id="gstep-4">
        <h2>포트폴리오와 품질 지표</h2>
        <div class="input-row">
          <div class="input-group">
            <label for="non-life-ratio">손해보험 비중: <span id="non-life-ratio-value" class="val-pill">50%</span></label>
            <input class="slider" type="range" id="non-life-ratio" min="0" max="100" value="50" />
          </div>
          <div class="input-group">
            <label for="persistency-range">유지율(13회차): <span id="persistency-value" class="val-pill">85%</span></label>
            <input class="slider" type="range" id="persistency-range" min="0" max="100" value="85" />
          </div>
        </div>
      </div>

      <div class="gstep" id="gstep-5">
        <h2>영업 방식(해당 모두 선택)</h2>
        <div class="checks">
          <label class="card-check"><input type="checkbox" name="sales-method" value="pioneering"><span><i></i>개척 영업</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="referral"><span><i></i>소개 영업</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="db"><span><i></i>DB 영업(인/아웃바운드)</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="seminar"><span><i></i>세미나 영업</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="inhouse"><span><i></i>인하우스/유입</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="niche"><span><i></i>특화 시장</span></label>
          <label class="card-check"><input type="checkbox" name="sales-method" value="corporate"><span><i></i>법인 영업</span></label>
        </div>
      </div>

      <div class="gstep" id="gstep-6">
        <h2>전문성과 성장성</h2>
        <div class="input-group">
          <label>자격증/교육 이수 (해당 모두 체크)</label>
          <div class="compact" id="cert-list">
            <label class="card-check"><input type="checkbox" value="life"><span><i></i>생명보험설계사</span></label>
            <label class="card-check"><input type="checkbox" value="nonlife"><span><i></i>손해보험설계사</span></label>
            <label class="card-check"><input type="checkbox" value="third"><span><i></i>제3보험설계사</span></label>
            <label class="card-check"><input type="checkbox" value="variable"><span><i></i>변액보험판매관리사</span></label>
            <label class="card-check"><input type="checkbox" value="afpk"><span><i></i>AFPK®</span></label>
            <label class="card-check"><input type="checkbox" value="cfp"><span><i></i>CFP®</span></label>
            <label class="card-check"><input type="checkbox" value="lossadj"><span><i></i>손해사정사</span></label>
            <label class="card-check"><input type="checkbox" value="fund"><span><i></i>펀드투자권유대행인</span></label>
            <label class="card-check"><input type="checkbox" value="securities"><span><i></i>증권투자권유대행인</span></label>
          </div>
          <div class="hint">전문점수 총합 최대 +10, 금액 가산 최대 +1,000만원</div>
        </div>
      </div>

      <div class="gstep" id="gstep-result">
        <div id="result-display">
          <div id="badge">Result</div>
          <h2 id="result-title">당신의 FVI와 예상 금액</h2>
          <div id="fvi-score">FVI 0</div>
          <div class="result-description" id="grade-text">등급 산정 중…</div>
          <p class="final-value"><span id="final-value-text">0원</span> <span class="value-unit">/ 내년도 나의 시장가치(₩)</span></p>
          <div class="insights" id="insights-box"></div>
          
          <div style="margin-top:14px; display:flex; gap:10px;">
            <button type="button" id="restart-btn">다시 계산</button>
            <button type="button" id="ai-consulting-btn">AI 컨설팅 받기</button>
            <button type="button" id="send-kakao-btn" style="background:#fae100;color:#111;">카카오톡으로 공유</button>
          </div>
          <div id="ai-result-container" style="display:none;">
            <h3 style="margin:14px 0 10px;font-size:16px;">GA WORLD AI의 분석 및 조언</h3>
            <div id="ai-result-content" style="border:1px solid var(--border);background:var(--input);padding:14px;border-radius:12px;color:var(--muted);min-height:44px;"></div>
          </div>
        </div>
      </div>
    </form>

    <div id="navigation-buttons">
      <button type="button" id="prev-btn" style="display:none;">이전</button>
      <button type="button" id="next-btn">다음</button>
      <button type="button" id="submit-btn" style="display:none;">결과 확인</button>
    </div>
  </div>
</div>

<script>
(function(){
  const root=document.getElementById("gaw-calc-root"); if(!root) return;
document.getElementById('access-url').value = window.location.href;
  const TOTAL_PAYOUT_MULT = 18.0;
  const FIRST_YEAR_MULT   = 12.0;

  const bgFill=document.getElementById("bg-fill"); const themeCheckbox=document.getElementById("theme-checkbox");
  function applyBg(theme){ bgFill.classList.add("bg-gradient"); bgFill.classList.remove("bg-gradient--light","bg-gradient--dark"); bgFill.classList.add(theme==="dark"?"bg-gradient--dark":"bg-gradient--light"); }
  function applyTheme(theme){ root.setAttribute("data-theme",theme); localStorage.setItem("fvi-theme",theme); themeCheckbox.checked=(theme==="dark"); applyBg(theme); }
  const prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;

  function calcExtraBonuses(){
    let fvi=0, amt=0;
    const push=(k)=>{const r=BONUS_RULES[k||"none"]||{}; fvi+=(r.fvi||0); amt+=(r.amount||0);};
    EXTRA_QUESTIONS.forEach(q=>{

      else if(typeof q.bonusCalc==="function"){ push(q.bonusCalc(v)); }

    return { extraFVI:Math.min(fvi,EXTRA_CAP.fvi), extraAmount:Math.min(amt,EXTRA_CAP.amount) };

  /* ==== 점수 계산 핵심 함수 모음 ==== */
  function scoreIncome(man){ const w=man*10000; if (w < 30000000) return 3; if (w < 50000000) return 7; if (w < 100000000) return 11; if (w <= 400000000) return 13; return 15; }
  function scoreContracts(n){ if (n < 5) return 2; if (n <= 10) return 5; if (n <= 20) return 8; return 10; }
  function scoreAP(man){ const w=man*10000; if (w < 500000) return 2; if (w < 1000000) return 4; if (w < 2000000) return 6; if (w < 3000000) return 8; if (w < 5000000) return 9; return 10; }
  function scorePNC(p){ if (p <= 30) return 1; if (p <= 40) return 2; if (p < 60) return 3; if (p < 70) return 4; return 5; }
  function scorePersistency(p){ if (p < 70) return 5; if (p < 80) return 10; if (p < 85) return 14; if (p < 90) return 17; return 20; }
  function scoreTenure(y){ if (y < 1) return 2; if (y < 3) return 5; if (y < 5) return 7; if (y < 10) return 8; return 10; }
  function scoreAge(age){ if (age >= 40 && age <= 59) return 5; if (age >= 30 && age <= 39) return 3; if (age < 30 || age >= 60) return 2; return 3; }
  function scoreChannels(cnt){ return Math.min(cnt*2, 10); }
  const CERT_FVI_WEIGHTS={ life:1, nonlife:1, third:1, fund:1, securities:1, variable:2, cklu:2, afpk:3, ifp:3, cfp:5, actuary:5, lossadj:4 };
  function scoreCerts(list){ const s=(list||[]).reduce((a,k)=>a+(CERT_FVI_WEIGHTS[k]||0),0); return Math.min(s,10); }

  /* ==== 원 점수 계산 & 결과 ==== */
  function calcFVIandAmount(){
    const p=formData, age=(new Date()).getFullYear()-(p["birth-year"]||1987);
    const currentValue=scoreIncome(p["prev-income-man"]||0)+scoreContracts(p["monthly-contracts"]||0)+scoreAP(p["monthly-premium"]||0)+scorePNC(p["non-life-ratio"]||50)+scorePersistency(p.persistency||0);
    const growthPotential=scoreTenure(p["career-length"]||0)+scoreAge(age)+scoreChannels((p.salesMethods||[]).length)+scoreCerts(p.certList||[]);
    const FVI=Math.min(currentValue,60)+Math.min(growthPotential,35)+(calcExtraBonuses().extraFVI||0);
    return { FVI: Math.round(FVI) };
  }

  }
  if ((p["q-referral-rate"] || 0) >= 40) {
    strengths.push("<strong>강력한 추천 네트워크(소개율 40% 이상):</strong> 높은 고객 만족도를 바탕으로 추가적인 비용 없이 신규 고객을 창출하는 선순환 구조를 만들었습니다.");
  }

  // [성장 기회 분석]
  if ((p.persistency || 0) < 85) {
    opportunities.push("<strong>계약 품질 향상:</strong> 13회차 유지율 85% 달성을 최우선 목표로 삼아 계약의 질을 높이고 장기적인 수익 안정성을 확보해야 합니다. <strong>(실행 방안: 완전판매 프로세스 점검 및 고객 만족도 해피콜 정기 시행)</strong>");
  }
  if ((p["q-daily-consults"] || 0) < 3) {
    opportunities.push("<strong>신규 고객 접점 확대:</strong> 하루 평균 상담 횟수를 3건 이상으로 설정하고 주간 활동 계획을 관리하여 영업 파이프라인을 넓힐 필요가 있습니다. <strong>(실행 방안: 주간 단위 활동량 목표 설정 및 결과 리뷰)</strong>");
  }
  if (marketingActivities.length <= 1) { // 카톡만 선택했거나 아무것도 선택 안 한 경우
    opportunities.push("<strong>온라인 영향력 구축:</strong> 하나의 SNS 채널(블로그 등)을 정해 전문적인 콘텐츠를 주 1회 이상 발행하여 온라인 신뢰를 쌓는 것이 중요합니다. <strong>(실행 방안: 본인 전문 분야 관련 콘텐츠 3개월 계획 수립 및 실행)</strong>");
  }
  if ((p["q-referral-rate"] || 0) < 20) {
    opportunities.push("<strong>소개 영업 활성화:</strong> 기존 고객의 만족도를 높여 자연스러운 소개로 이어지게 만들어야 합니다. <strong>(실행 방안: 분기별 정보지 발송 등 체계적인 사후 관리를 통한 소개 요청 프로세스 정립)</strong>");
  }

  // --- 최종 결과 리포트(HTML) 생성 ---
  let introHTML = `<h4>💡 종합 분석</h4><p style="margin:0; line-height:1.7;">FVI 종합점수 ${FVI}점, <strong>'${grade5.label}'</strong> 등급의 ${fpType} 현재 안정적인 성과와 더불어 명확한 성장 잠재력을 보유하고 있습니다. 산출된 시장가치는 내년 예상 총소득 <strong>${formatKoreanWon(financialData.totalNextYearIncome)}</strong>과 정착지원금 최대치 <strong>${formatKoreanWon(financialData.relocationBonusMax)}</strong>를 더한 추정치입니다.</p>`;

  let strengthHTML = `<h4 style="margin-top:20px;">👍 주요 강점</h4><ul style="margin:0; padding-left:20px; line-height:1.8;">`;
  if (strengths.length > 0) {
    strengthHTML += strengths.map(s => `<li>${s}</li>`).join('');
  } else {
    strengthHTML += "<li>현재 활동 데이터를 기반으로 자신만의 핵심 강점을 정의하고 발전시켜 나갈 중요한 시기입니다.</li>";
  }
  strengthHTML += "</ul>";

  let opportunityHTML = `<h4 style="margin-top:20px;">📈 성장 기회 및 실행 방안</h4><ul style="margin:0; padding-left:20px; line-height:1.8;">`;
  if (opportunities.length > 0) {
    opportunityHTML += opportunities.map(o => `<li>${o}</li>`).join('');
  } else {
    opportunityHTML += "<li>현재의 강점을 더욱 극대화하고, 시장 변화에 맞춰 새로운 영업 전략을 시도하며 한 단계 더 도약할 수 있습니다.</li>";
  }
  opportunityHTML += `</ul><p style="text-align:center; font-size:13px; opacity:0.8; margin-top:16px;">위 성장 기회를 잘 활용하신다면, 내년에는 더욱 높은 시장 가치를 인정받는 전문가로 발돋움하실 수 있을 것입니다.</p>`;

  return introHTML + strengthHTML + opportunityHTML;
}

  function renderAdditionalResults(fviScore) {
    let container = document.getElementById("additional-results-container");
    if (!container) {
        container = document.createElement("div");
        container.id = "additional-results-container";
        root.querySelector("#insights-box").after(container);
    }
    const hasTerm = hasTerminationWithin3Y(), apWon = computeAnnualAPWon();
    const firstYear = computeFirstYearCommission(apWon), trail = computeTrailCommission(apWon, hasTerm);
    const totalIncome = firstYear + trail, bonus = computeRelocationBonus();
    
    container.innerHTML = `
        <h3>내년 예상 총소득 및 성장 분석</h3>
        <div class="result-breakdown">
            <p><span>1년 차 지급 (1200%)</span> <span>${formatKoreanWon(firstYear)}</span></p>
            <p><span>유지 수수료 (연)</span> <span>${hasTerm ? '0원 (해촉 이력 반영)' : formatKoreanWon(trail)}</span></p>
            <p class="total"><span><strong>내년 예상 총소득</strong></span> <span><strong>${formatKoreanWon(totalIncome)}</strong></span></p>
        </div>
        <p class="info-line">정착지원금 추정(이직 시): ${formatKoreanWon(bonus.min)} ~ ${formatKoreanWon(bonus.max)}</p>
        <div class="growth-indicators"><h3>성장 가능성 지표</h3>${buildGrowthIndicatorsHTML()}</div>
        <p class="disclaimer">※ 유지 수수료(잔여수수료)는 이직 시점과 횟수, 계약 조건에 따라 개인별 차이가 크게 발생할 수 있습니다.</p>
    `;
    
    return { firstYearCommission: firstYear, trailCommission: trail, totalNextYearIncome: totalIncome, relocationBonusMin: bonus.min, relocationBonusMax: bonus.max, grade5: mapFVIToGrade5(fviScore) };
  }

  function goPrev(){ if(currentStep > 1) { currentStep--; showStep(currentStep); } }
  function goNext(){
    softValidate();
    if (currentStep <= 6) saveBase(); else saveExtras();
    if (currentStep < LAST_INPUT_STEP()){ currentStep++; showStep(currentStep); }
    else if (currentStep === LAST_INPUT_STEP()){
      const { FVI } = calcFVIandAmount();
      const grade5 = mapFVIToGrade5(FVI);
      const nextYearData = renderAdditionalResults(FVI);
      const marketValue = nextYearData.totalNextYearIncome + nextYearData.relocationBonusMax;

      if(root.querySelector("#result-title")) root.querySelector("#result-title").textContent = `${formData["user-name"]||'신청자'}님의 FVI와 예상 금액`;
      fviScoreEl.textContent = `FVI ${FVI}`;
      gradeText.innerHTML = `5단계 등급: <strong>${grade5.label} (${grade5.code})</strong>`;
      finalValueText.textContent = formatKoreanWon(marketValue);
    insightsBox.innerHTML = buildInsights(FVI, grade5, nextYearData);
      
      window.__FVI__ = { FVI, grade: grade5.label, amountKRW: marketValue };
      sendDataToGoogleSheet({ FVI, amount: marketValue, grade: grade5.label, nextYear: nextYearData });
      currentStep=RESULT_INDEX(); showStep(currentStep);
    }
  }
  prevBtn.addEventListener("click",goPrev); nextBtn.addEventListener("click",goNext); submitBtn.addEventListener("click",goNext);

  root.querySelector("#calculator-form").addEventListener("keydown",(e)=>{
    if(e.key!=="Enter") return; e.preventDefault();
    if(e.shiftKey){ goPrev(); return; }
    if(currentStep<LAST_INPUT_STEP()) nextBtn.click(); else if(currentStep===LAST_INPUT_STEP()) submitBtn.click();
  });

  rangePNC?.addEventListener("input",()=>{ if(rangePNCText) rangePNCText.textContent=`${(+rangePNC.value||0)}%`; });
  rangePR?.addEventListener("input",()=>{ if(rangePRText) rangePRText.textContent=`${(+rangePR.value||0)}%`; });

  function formatWithCommasKeepCursor(input){
    const start=input.selectionStart, before=input.value, digits=before.replace(/[^\d]/g,'');
    if(digits===""){ input.value=""; prevIncomeHint.textContent="예: 100,000,000원 = 1억 0만원"; return; }
    const after=Number(digits).toLocaleString('ko-KR'); input.value=after;
    const diff=after.length-before.length; input.setSelectionRange(Math.max(0,(start||after.length)+diff), Math.max(0,(start||after.length)+diff));
    prevIncomeHint.textContent = `${after}원 = ${formatKoreanWon(Number(digits))}`;
  }
  prevIncomeKRWInput?.addEventListener("input",()=>formatWithCommasKeepCursor(prevIncomeKRWInput));

  document.getElementById("restart-btn")?.addEventListener("click",()=>{
  // 현재 주소에서 쿼리스트링(?fvi=...)을 제외한 기본 주소로 새 창을 엽니다.
  const baseUrl = window.location.origin + window.location.pathname;
  window.open(baseUrl, '_blank');
});

  async function runGemini(){
    const aiBtn = document.getElementById("ai-consulting-btn");
    const aiBox = document.getElementById("ai-result-container");
    const aiContent = document.getElementById("ai-result-content");
    const GEMINI_API_KEY="AIzaSyBO1RdvcdQP4rXm1EtRAiOY0EE86seTF9Y";
    const GEMINI_MODEL="gemini-1.5-flash-latest";
    const GEMINI_URL=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;

    if(!aiBtn || !aiBox || !aiContent) { console.error("AI 컨설팅에 필요한 DOM 요소를 찾을 수 없습니다."); return; }

    aiBox.style.display="block"; aiContent.innerHTML='<div class="loader" style="margin:10px auto"></div>';
    aiBtn.disabled=true; aiBtn.style.opacity=".5";
    const profile = Object.entries(formData).map(([key, value]) => `- ${key}: ${Array.isArray(value) ? value.join(', ') : value}`).join('\n');
const promptEnhanced = `You are a senior branch manager and performance analyst in the South Korean insurance industry. Your analysis MUST be strictly and logically based on the provided FP Profile data. Do not make assumptions or generalize beyond the data given.

**Core Instructions:**
1.  **Ground all claims in data:** For every strength or weakness you list, cite the specific data point from the profile that supports it.
2.  **Be realistic about weaknesses:** If a value is low (e.g., persistency < 85%, monthly-premium < 100) or an option is not selected, clearly identify it as a weakness or an area for improvement.
3.  **Marketing Skill Evaluation:**
    - If 'q-digital-marketing' is only ['dm_kakao'] or ['dm_sns_start'], classify this as a **"very early stage"** weakness and recommend foundational steps. Do NOT praise their marketing ability.
    - Only classify marketing as a 'strength' if the profile includes 'dm_1k' (1k followers) or higher.
4.  **Action Plan:** The 'actions_90days' plan must directly address the top 2-3 weaknesses identified in your analysis. The KPIs must be specific and measurable.

**JSON Schema (Strictly Adhere):**
{"intro": "A 1-2 sentence summary based on FVI grade and key data points.", "strengths": [{"point": "Specific strength...", "evidence": "Based on persistency of 92%"}], "weaknesses": [{"point": "Specific weakness...", "evidence": "Based on q-daily-consults being 2"}], "next_year_income": { "first_year_commission": 0, "trail_commission": 0, "total": 0, "relocation_bonus_min": 0, "relocation_bonus_max": 0 }, "grade5": {"code":"G1-G5","label":"...","hint":"..."}, "actions_90days": [ {"title":"...", "detail":"...", "kpi":"..."}, {"title":"...", "detail":"...", "kpi":"..."} ]}

**FP Profile:**
${profile}`;    const renderFromJSON=(obj)=>{
      const esc = (s)=>String(s ?? "").replace(/[&<>]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m]));
      const toLI=(arr)=> (arr||[]).map(t=>`<li>${esc(t)}</li>`).join("") || "<li>내용 없음</li>";
      const actions = (obj.actions_90days||[]).map(t=>`<li><strong>${esc(t.title)}:</strong> ${esc(t.detail)} (KPI: ${esc(t.kpi)})</li>`).join("") || "<li>내용 없음</li>";
      const income = obj.next_year_income || {}, grade = obj.grade5 || {};
      return `<div class="ai-sections"><div class="ai-card"><h4>핵심 요약</h4><p style="margin:0;color:var(--muted);line-height:1.7">${esc(obj.intro)}</p></div><div class="ai-card"><h4>상세 분석</h4><ul style="margin:0;padding-left:20px;line-height:1.8;"><li><strong>5단계 등급:</strong> ${esc(grade.label)} (${esc(grade.code)}) - ${esc(grade.hint)}</li><li><strong>내년 예상소득:</strong> ${formatKoreanWon(income.total)} (1년차 ${formatKoreanWon(income.first_year_commission)} + 유지 ${formatKoreanWon(income.trail_commission)})</li><li><strong>성장 지표:</strong> ${(obj.growth_flags || []).join(', ') || "데이터 부족"}</li></ul></div><div class="ai-card"><h4>강점</h4><ul style="margin:0;padding-left:20px;line-height:1.8;">${toLI(obj.strengths)}</ul></div><div class="ai-card"><h4>보완점</h4><ul style="margin:0;padding-left:20px;line-height:1.8;">${toLI(obj.weaknesses)}</ul></div><div class="ai-card ai-tips"><h4>90일 실행 계획</h4><ol style="margin:0;padding-left:20px;line-height:1.8;">${actions}</ol></div></div>`;
    };
    try{
      if(!GEMINI_API_KEY || GEMINI_API_KEY.includes("YOUR_API_KEY")){ aiContent.textContent="API 키가 비어 있습니다."; return; }
      const res = await fetch(GEMINI_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ contents:[{ parts:[{ text: promptEnhanced }]}] }) });
      if(!res.ok) throw new Error(`Gemini API 오류: ${res.status} ${res.statusText}`);
      const data=await res.json();
      let text=data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      text=text.trim().replace(/^```(?:json)?\s*/i,"").replace(/```$/i,"").trim();
      let obj; try{ obj=JSON.parse(text); } catch(_){ obj={intro:"AI 분석 결과 생성에 실패했습니다."}; }
      aiContent.innerHTML = renderFromJSON(obj);
    }catch(e){
      console.error(e); aiContent.textContent="AI 분석에 실패했습니다.";
    }finally{
      aiBtn.disabled=false; aiBtn.style.opacity="1";
    }
  }
  document.getElementById("ai-consulting-btn")?.addEventListener("click", runGemini);

  function makeShareUrl(FVI, grade, amountKRW){
    const url = new URL(window.location.href);
    url.searchParams.set("fvi", String(FVI)); url.searchParams.set("grade", grade); url.searchParams.set("amount", String(amountKRW));
    try{ url.searchParams.set("p", btoa(unescape(encodeURIComponent(JSON.stringify(formData))))); }catch(_){}
    return url.toString();
  }
  document.getElementById("send-kakao-btn")?.addEventListener("click", ()=>{
    if(!(window.Kakao && Kakao.isInitialized && Kakao.isInitialized())){ alert("카카오 SDK 초기화 실패"); return; }
    const d = window.__FVI__; if(!d){ alert("먼저 결과를 계산해 주세요."); return; }
    const shareUrl = makeShareUrl(d.FVI, d.grade, d.amountKRW);
    const userName = formData["user-name"] || '신청자';
    Kakao.Share.sendDefault({
      objectType: "feed",
      content: {
        title: `${userName}님의 FP 가치(FVI) 결과 확인`,
        description: `FVI ${d.FVI}점 | 내년 시장가치: ${formatKoreanWon(d.amountKRW)} | 등급: ${d.grade}`,
        imageUrl: "https://cdn.imweb.me/upload/S2016083157c63a62163fa/0f6f7efb6a83a.png",
        link: { mobileWebUrl: shareUrl, webUrl: shareUrl },
      },
      buttons: [ { title: "설계사지수(FVI) 보기", link: { mobileWebUrl: shareUrl, webUrl: shareUrl } } ],
    });
  });

  (function hydrateFromQuery(){
    const p = new URLSearchParams(location.search);
    const fvi = p.get("fvi"), grade = p.get("grade"), amount = p.get("amount");
    if(p.get("p")){ try{ Object.assign(formData, JSON.parse(decodeURIComponent(escape(atob(p.get("p")))))); }catch(e){ console.warn("payload decode failed", e); } }
    if(!fvi) { showStep(1); return; }
    
    const fviNum = Number(fvi);
    const grade5 = mapFVIToGrade5(fviNum);
    const nextYearData = renderAdditionalResults(fviNum);
    const marketValue = nextYearData.totalNextYearIncome + nextYearData.relocationBonusMax;

    if(root.querySelector("#result-title")) root.querySelector("#result-title").textContent = `${formData['user-name']||'신청자'}님의 FVI와 예상 금액`;
    fviScoreEl.textContent = `FVI ${fviNum}`;
    gradeText.innerHTML = `5단계 등급: <strong>${grade5.label} (${grade5.code})</strong>`;
    finalValueText.textContent = formatKoreanWon(marketValue);
    insightsBox.textContent = buildInsights(fviNum, grade5, nextYearData);

    if(document.getElementById("send-kakao-btn")) document.getElementById("send-kakao-btn").style.display = 'none';
    if(document.getElementById("ai-consulting-btn")) document.getElementById("ai-consulting-btn").style.display = 'none';
    window.__FVI__ = { FVI: fviNum, grade: grade5.label, amountKRW: marketValue };
    currentStep = RESULT_INDEX(); showStep(currentStep);
  })();
})();
</script>
